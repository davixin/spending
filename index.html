<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dépenses variables</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2421;--mu:#6b726d;--ac:#2f6f5e;--bd:#e3e1da;--bar:#cfe3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a18;--card:#222623;--tx:#eceee9;--mu:#9aa29c;--ac:#6fc2a8;--bd:#33382f;--bar:#2c4a40}}
:root[data-theme="dark"]{--bg:#171a18;--card:#222623;--tx:#eceee9;--mu:#9aa29c;--ac:#6fc2a8;--bd:#33382f;--bar:#2c4a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:14px;color:var(--mu);margin:0 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-bottom:8px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
input,select{flex:1;width:100%}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;font-weight:600}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{font-size:17px;text-transform:capitalize}
.cat{margin:10px 0}
.cat .l{display:flex;justify-content:space-between;font-size:15px}
.bar{height:8px;background:var(--bar);border-radius:5px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;border-top:1px solid var(--bd);padding-top:10px;margin-top:12px}
.e{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.e small{color:var(--mu);display:block}
.e button{padding:4px 9px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chip{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 4px 3px 12px;font-size:14px}.chip button{border:0;background:none;padding:2px 8px;color:var(--mu)}
.mu{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Dépenses variables</h1>

<div class="card">
  <h2>Nouvelle dépense</h2>
  <div class="row"><input id="amt" type="number" inputmode="decimal" step="0.05" placeholder="Montant (€)"><input id="date" type="date"></div>
  <div class="row"><select id="cat"></select><input id="note" placeholder="Note (facultatif)"></div>
  <button class="p" id="add">Ajouter</button>
</div>

<div class="card">
  <div class="nav"><button id="prev">←</button><b id="mon"></b><button id="next">→</button></div>
  <div id="sum"></div>
  <div class="tot"><span>Total</span><span id="tot"></span></div>
</div>

<div class="card">
  <h2>Détail du mois</h2>
  <div id="list"></div>
</div>

<div class="card">
  <h2>Catégories</h2>
  <div class="chips" id="cats"></div>
  <div class="row"><input id="newcat" placeholder="Nouvelle catégorie"><button id="addcat">+</button></div>
  <div class="row"><button id="exp">Exporter CSV</button><button id="imp">Importer CSV</button><input id="file" type="file" accept=".csv,text/csv" hidden></div>
  <p class="mu">Données enregistrées uniquement sur cet appareil, dans ce navigateur. Exporte un CSV de temps en temps pour garder une sauvegarde.</p>
</div>
</main>
<script>
const K='depenses_v1';
let S={cats:['Courses','Essence','Loisirs','Restaurants','Santé','Divers'],items:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let cur=new Date();cur.setDate(1);
$('date').value=iso(new Date());
const fmt=n=>n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  $('cat').innerHTML=S.cats.map(c=>'<option>'+esc(c)+'</option>').join('');
  $('cats').innerHTML=S.cats.map(c=>'<span class="chip">'+esc(c)+'<button data-c="'+esc(c)+'" aria-label="Supprimer la catégorie">✕</button></span>').join('');
  $('mon').textContent=cur.toLocaleDateString('fr-CH',{month:'long',year:'numeric'});
  const p=iso(cur).slice(0,7);
  const its=S.items.filter(i=>i.d.startsWith(p)).sort((a,b)=>b.d.localeCompare(a.d));
  const by={};its.forEach(i=>by[i.c]=(by[i.c]||0)+i.a);
  const tot=its.reduce((s,i)=>s+i.a,0);
  const keys=Object.keys(by).sort((a,b)=>by[b]-by[a]);
  $('sum').innerHTML=keys.length?keys.map(k=>'<div class="cat"><div class="l"><span>'+esc(k)+'</span><span>'+fmt(by[k])+'</span></div><div class="bar"><i style="width:'+(by[k]/tot*100)+'%"></i></div></div>').join(''):'<p class="mu">Aucune dépense ce mois-ci.</p>';
  $('tot').textContent=fmt(tot);
  $('list').innerHTML=its.length?its.map(i=>'<div class="e"><div>'+esc(i.c)+(i.n?' · '+esc(i.n):'')+'<small>'+new Date(i.d+'T12:00').toLocaleDateString('fr-CH',{day:'numeric',month:'short'})+'</small></div><div>'+fmt(i.a)+' <button data-id="'+i.id+'" aria-label="Supprimer">✕</button></div></div>').join(''):'<p class="mu">—</p>';
}
$('add').onclick=()=>{
  const a=parseFloat($('amt').value.replace(',','.'));
  if(!(a>0))return $('amt').focus();
  S.items.push({id:Date.now()+Math.random().toString(36).slice(2,6),a,c:$('cat').value,d:$('date').value||iso(new Date()),n:$('note').value.trim()});
  save();$('amt').value='';$('note').value='';
  const d=new Date($('date').value+'T12:00');cur=new Date(d.getFullYear(),d.getMonth(),1);
  render();$('amt').focus();
};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id&&confirm('Supprimer cette dépense ?')){S.items=S.items.filter(i=>i.id!==id);save();render()}};
$('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$('cats').onclick=e=>{
  const c=e.target.dataset.c;if(c===undefined)return;
  if(S.cats.length<2)return alert('Garde au moins une catégorie.');
  const n=S.items.filter(i=>i.c===c).length;
  if(!confirm('Supprimer la catégorie « '+c+' » ?'+(n?'\n\nLes '+n+' dépense(s) déjà saisies restent comptées dans leurs mois.':'')))return;
  S.cats=S.cats.filter(x=>x!==c);save();render();
};
$('addcat').onclick=()=>{const v=$('newcat').value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);save();$('newcat').value='';render()}};
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
$('exp').onclick=()=>{
  const rows=['date;categorie;montant;note'].concat(S.items.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(i=>[i.d,q(i.c),String(i.a).replace('.',','),q(i.n)].join(';')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv'}));
  a.download='depenses.csv';document.body.appendChild(a);a.click();a.remove();
};
function parseLine(l){const r=[];let c='',iq=false;for(let i=0;i<l.length;i++){const ch=l[i];if(iq){if(ch=='"'){if(l[i+1]=='"'){c+='"';i++}else iq=false}else c+=ch}else if(ch=='"')iq=true;else if(ch==';'){r.push(c);c=''}else c+=ch}r.push(c);return r}
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const have=new Set(S.items.map(i=>[i.d,i.c,i.a,i.n].join('|')));let n=0;
    rd.result.replace(/^\ufeff/,'').split(/\r?\n/).slice(1).forEach(l=>{
      if(!l.trim())return;
      const [d,c,m,note='']=parseLine(l);const a=parseFloat(String(m).replace(',','.'));
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!(a>0)||!c)return;
      const k=[d,c,a,note].join('|');if(have.has(k))return;have.add(k);
      if(!S.cats.includes(c))S.cats.push(c);
      S.items.push({id:Date.now()+Math.random().toString(36).slice(2,6),a,c,d,n:note});n++;
    });
    save();render();alert(n+' dépense(s) importée(s).');e.target.value='';
  };
  rd.readAsText(f);
};
render();
</script>
</body>
</html>
